<!DOCTYPE html>
<html lang="es">

<!-- Head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./src/output.css">
    <script src="js/main.js" defer></script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome -->
</head>

<body class="relative overflow-auto text-gray-800 dark:text-gray-200 min-h-screen p-4 font-sans">
    <!-- Gradientes -->
    <div aria-hidden="true" class="flex absolute -top-96 start-1/2 transform -translate-x-1/2">
        <div class="bg-gradient-to-r from-violet-300/50 to-purple-100 blur-3xl w-[25rem] h-[44rem] rotate-[-60deg] transform -translate-x-[10rem] dark:from-violet-900/50 dark:to-purple-900"></div>
        <div class="bg-gradient-to-tl from-blue-50 via-blue-100 to-blue-50 blur-3xl w-[90rem] h-[50rem] rounded-fulls origin-top-left -rotate-12 -translate-x-[15rem] dark:from-indigo-900/70 dark:via-indigo-900/70 dark:to-blue-900/70"></div>
    </div>
    <!-- Contenedor principal -->
    <div class="relative z-10 bg-gradient-to-br from-gray-100 via-gray-200 to-gray-300 dark:from-gray-800 dark:via-gray-700 dark:to-gray-600 p-6 rounded-lg shadow-md w-full max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center bg-clip-text text-transparent bg-gradient-to-l from-blue-500 to-purple-400 dark:from-blue-300 dark:to-purple-300">
            <i class="fa-solid fa-palette"></i> Selector de Color
        </h1>

        <!-- Selector de color -->
        <div class="mb-6">
            <label for="colorPicker" class="block text-lg font-medium mb-2 bg-clip-text text-transparent bg-gradient-to-l from-blue-500 to-purple-400 dark:from-blue-300 dark:to-purple-300">
                Selecciona un color:
            </label>
            <input type="color" id="colorPicker" class="w-full h-12 rounded-lg border border-gray-300 dark:border-gray-700 cursor-pointer" />
        </div>

        <!-- Muestra del color y código RGB -->
        <div class="mb-6">
            <div id="colorBox" class="w-full h-24 rounded-lg border border-gray-300 dark:border-gray-700"></div>
            <p id="colorCode" class="mt-4 text-center text-lg font-medium bg-clip-text text-transparent bg-gradient-to-l from-blue-500 to-purple-400 dark:from-blue-300 dark:to-purple-300"></p>
        </div>

        <!-- Carga de imagen -->
        <div>
            <label for="imageInput" class="block text-lg font-medium mb-2 bg-clip-text text-transparent bg-gradient-to-l from-blue-500 to-purple-400 dark:from-blue-300 dark:to-purple-300 select-none">
                Cargar imagen:
            </label>
            <div class="relative">
                <input type="file" id="imageInput" accept="image/*" class="hidden" />
                <a id="selectFileButton" class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-blue-600 text-white hover:bg-blue-700 hover:scale-105 transition-transform duration-300 cursor-pointer disabled:opacity-50 disabled:pointer-events-none dark:focus:outline-none dark:focus:ring-1 dark:focus:ring-gray-600">
                    Seleccionar archivo
                    <svg class="flex-shrink-0 w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </a>
            </div>
            <div class="overflow-auto max-h-[70vh] mt-4">
                <canvas id="canvas" class="w-full border border-gray-300 dark:border-gray-700 rounded-lg"></canvas>
            </div>
        </div>

        <!-- Botón Volver al inicio -->
        <div class="mt-6 text-center">
            <a href="index.html" class="py-2 px-4 rounded-lg border border-gray-300 dark:border-gray-700 bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200 font-medium hover:bg-gray-300 dark:hover:bg-gray-600">
                Volver al inicio
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
        © 2025 Selector de Color. Todos los derechos reservados.
    </footer>
</body>
</html>
